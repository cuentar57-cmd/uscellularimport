name: Publish development preview
on:
  push:
    branches:
      - desarrollo
permissions:
  contents: write
concurrency:
  group: uscellularimport-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          path: source
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy website into preview folder
        run: |
          mkdir -p target/preview
          cp source/index.html source/catalogo.js source/checkout.html source/producto.html source/motion.css source/motion.js source/premium-motion.css source/premium-motion.js source/checkout-motion.css source/checkout-motion.js target/preview/
      - name: Publish preview without changing production files
        run: |
          cd target
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preview/
          if git diff --cached --quiet; then echo 'Preview is already current'; exit 0; fi
          git commit -m 'Update development preview'
          git push origin HEAD:main
