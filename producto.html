<!doctype html><html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><title>Detalle del producto | US Cellular Import</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#fff;--surface:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e3e3e6;--nav:rgba(255,255,255,.92)}
html[data-theme="dark"]{--bg:#080809;--surface:#151517;--card:#202023;--text:#f5f5f7;--muted:#a1a1a6;--line:#333337;--nav:rgba(8,8,9,.9)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.container{width:min(1100px,calc(100% - 40px));margin:auto}

</style></head><body><header class="header"><div class="container head-inner"><a class="brand" href="./index.html"><span class="brand-mark">US</span> CELLULAR IMPORT</a><nav class="head-links"><a href="./index.html#sellados">Catálogo</a><a href="./checkout.html">Carrito / Checkout</a></nav></div></header><main><div class="container"><a class="back" href="./index.html#sellados">← Volver al catálogo</a><div id="productDetail"></div></div></main><footer><div class="container foot-inner"><span>© US Cellular Import · Importaciones de Telefonía Móvil</span><span>Catálogo de demostración · Precios y stock sujetos a confirmación</span></div></footer><script src="./catalogo.js"></script><script>const P=window.USCI_PRODUCTS||[];const KEY=window.USCI_CART_KEY||'usci-cart-v1';const el=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function readCart(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}function saveCart(cart){localStorage.setItem(KEY,JSON.stringify(cart))}function addItem(id){const cart=readCart(),old=cart.find(x=>x.id===id);if(old)old.qty++;else cart.push({id,qty:1});saveCart(cart);return cart}try{if(localStorage.getItem('usci-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
const id=new URLSearchParams(location.search).get('id');const p=P.find(x=>x.id===id);
if(!p){el('productDetail').innerHTML='<div class="empty"><h1>Producto no encontrado</h1><p>Podés regresar al catálogo para explorar los modelos.</p><a class="btn" href="./index.html#sellados">Ver catálogo</a></div>'}
else{document.title=p.name+' | US Cellular Import';el('productDetail').innerHTML='<div class="detail-grid"><div class="image-box">'+(p.pic?'<img src="'+safe(p.pic)+'" alt="'+safe(p.name)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'image-fallback\',textContent:'+JSON.stringify("Imagen no disponible")+'}))">':'<div class="image-fallback">'+safe(p.name)+'</div>')+'</div><div><div class="detail-tags">'+safe(p.tag)+' · US CELLULAR IMPORT</div><h1>'+safe(p.name)+'</h1><p class="muted">'+safe(p.desc)+'. Consultá las capacidades, colores, condiciones y disponibilidad con la empresa.</p><div class="price">Precio a consultar</div><div class="specs"><div class="spec"><small>Modelo</small><strong>'+safe(p.name)+'</strong></div><div class="spec"><small>Estado / categoría</small><strong>'+safe(p.tag)+'</strong></div><div class="spec"><small>Disponibilidad</small><strong>A confirmar</strong></div><div class="spec"><small>Precio</small><strong>A cotizar</strong></div></div><button class="btn" id="addDetail">Agregar al carrito y continuar al checkout</button><p class="muted">No se realiza ningún cobro online. El checkout prepara una solicitud de cotización.</p></div></div>';el('addDetail').onclick=()=>{addItem(p.id);location.href='./checkout.html'}}
</script></body></html>
